
name: AIRA Digital News Auto Update

on:
 schedule:
   # Low-token mode: once per hour.
   - cron: "0 * * * *"
 workflow_dispatch:

permissions:
 contents: write

jobs:
 update:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Install dependencies
       run: python -m pip install requests

     - name: AIRA low-token editorial update
       env:
         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
         OPENAI_MODEL: gpt-5.6-luna
       run: python scripts/update_digital_news.py

     - name: Commit changes
       run: |
         git config user.name "AIRA Digital News"
         git config user.email "actions@users.noreply.github.com"
         git add data/digital-news-content.json data/digital-news-registry.json

         if git diff --cached --quiet; then
           exit 0
         fi

         git commit -m "AIRA: low-token Digital News update"
         git push


