<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#063b76"
>

<meta
  name="description"
  content="The Hyderabad Daily — Today's E-Paper"
>

<title>The Hyderabad Daily | E-Paper</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

:root{
  --navy:#073d78;
  --navy2:#0b529d;
  --red:#d71920;
  --page-bg:#edf4f9;
  --text:#151b25;
  --muted:#68717d;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  background:
    linear-gradient(
      180deg,
      #f7fafc 0%,
      #eaf2f8 100%
    );

  color:var(--text);

  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

img{
  max-width:100%;
}

a{
  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   TOP LINE
===================================================== */

.topline{
  height:5px;

  background:
    linear-gradient(
      90deg,
      #063b76 0 72%,
      #d71920 72% 100%
    );
}


/* =====================================================
   MASTHEAD
===================================================== */

header{
  background:#fff;

  border-bottom:
    1px solid #d6e0e9;
}

.mast{
  max-width:1250px;

  margin:auto;

  min-height:105px;

  padding:
    10px 20px;

  display:grid;

  grid-template-columns:
    170px
    1fr
    190px;

  align-items:center;

  gap:10px;
}

.mast-side{
  font:
    700 12px/1.25
    Georgia,
    serif;

  color:#111;
}

.mast-side.right{
  text-align:right;
}

.mast-side strong{
  color:#0755a2;
}

.mast-line{
  width:75px;
  height:2px;

  background:#e21d2a;

  margin-top:5px;
}

.mast-side.right .mast-line{
  margin-left:auto;
}

.mast-logo{
  display:block;

  width:auto;

  max-width:620px;

  max-height:92px;

  margin:auto;
}


/* =====================================================
   NAVIGATION
===================================================== */

.main-nav{
  display:flex;

  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #0b519b,
      #06366c
    );

  border-bottom:
    3px solid #d9e6f1;
}

.main-nav a{
  flex:1;

  max-width:280px;

  padding:
    12px 15px;

  text-align:center;

  color:#fff;

  text-decoration:none;

  font:
    800 14px
    Arial,
    sans-serif;

  border-left:
    1px solid
    rgba(255,255,255,.25);
}

.main-nav a:last-child{
  border-right:
    1px solid
    rgba(255,255,255,.25);
}

.main-nav a:hover{
  background:#0d5eaa;
}


/* =====================================================
   MAIN
===================================================== */

.page{
  width:100%;

  max-width:1250px;

  margin:auto;
}

.section{
  padding:
    8px 18px 30px;
}


/* =====================================================
   TOP BANNER
===================================================== */

.top-banner-wrap{
  width:100%;

  max-width:1100px;

  margin:
    8px auto 8px;

  padding:
    0 4px;
}

.top-banner{
  display:block;

  width:100%;

  line-height:0;

  text-decoration:none;

  overflow:hidden;

  border-radius:8px;

  background:#fff;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.12);
}

.top-banner img{
  display:block;

  width:100%;

  height:auto;

  margin:0;

  padding:0;
}


/* =====================================================
   NEWSPAPER FRAME
===================================================== */

.epaper-shell{
  width:100%;

  padding:13px;

  background:
    linear-gradient(
      145deg,
      #07111e,
      #101e2e
    );

  border-radius:8px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.22);
}

.epaper-stage{
  width:100%;

  max-width:1100px;

  margin:auto;

  background:#fff;
}

#pageImage{
  display:block;

  width:100%;

  height:auto;

  margin:auto;

  cursor:pointer;
}


/* =====================================================
   BOTTOM ADVERTISEMENT AREA
===================================================== */

#pageAdContainer{
  width:100%;

  max-width:1100px;

  margin:
    12px auto 0;
}


/* =====================================================
   INDEPENDENT AD ROTATOR
===================================================== */

#bottomAdRotator{
  position:relative;

  width:100%;

  overflow:hidden;

  background:#fff;

  border:
    1px solid #d8d8d8;

  border-radius:8px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.10);

  min-height:1px;
}

.bottom-ad-slide{
  display:none;

  width:100%;

  margin:0;

  padding:0;

  line-height:0;

  text-decoration:none;

  overflow:hidden;

  opacity:0;

  transition:
    opacity .35s ease;
}

.bottom-ad-slide.active{
  display:block;

  opacity:1;
}

.bottom-ad-slide img{
  display:block;

  width:100%;

  max-width:100%;

  height:auto;

  margin:0;

  padding:0;

  object-fit:contain;
}


/* =====================================================
   CONTROLS
===================================================== */

.epaper-tools{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:9px;

  flex-wrap:wrap;

  padding:12px;

  background:#fff;

  border:
    1px solid #d3dde7;
}

.epaper-tools button{
  border:0;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #124d91,
      #07366c
    );

  color:#fff;

  padding:
    11px 18px;

  cursor:pointer;

  font:
    800 12px
    Arial,
    sans-serif;
}

.epaper-tools button:hover{
  background:#0b5ba8;
}

#counter{
  min-width:140px;

  text-align:center;

  font:
    800 13px
    Arial,
    sans-serif;
}


/* =====================================================
   THUMBNAILS
===================================================== */

.page-grid{
  display:grid;

  grid-template-columns:
    repeat(10,1fr);

  gap:8px;

  margin-top:10px;
}

.page-card{
  padding:4px;

  background:#fff;

  border:
    2px solid transparent;

  border-radius:4px;

  cursor:pointer;

  box-shadow:
    0 2px 7px
    rgba(0,0,0,.08);
}

.page-card.active{
  border-color:var(--navy);
}

.page-card img{
  display:block;

  width:100%;

  aspect-ratio:3/4;

  object-fit:cover;
}

.page-card b{
  display:block;

  text-align:center;

  margin-top:4px;

  color:var(--navy);

  font:
    800 9px
    Arial,
    sans-serif;
}

.page-card span{
  display:block;

  text-align:center;

  color:#697481;

  margin:
    2px 0 4px;

  font:
    8px
    Arial,
    sans-serif;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  margin-top:0;

  padding:
    22px 12px;

  background:
    linear-gradient(
      180deg,
      #083f7b,
      #062d5a
    );

  color:#fff;

  text-align:center;

  font:
    11px/1.6
    Arial,
    sans-serif;
}

footer strong{
  font-size:15px;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:950px){

  .mast{
    grid-template-columns:
      120px
      1fr
      145px;
  }

  .mast-logo{
    max-width:500px;
  }

  .page-grid{
    grid-template-columns:
      repeat(5,1fr);
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  body{
    background:#edf4f9;
  }


  /* HEADER */

  .mast{
    display:block;

    min-height:0;

    padding:
      9px 6px 7px;
  }

  .mast-side{
    display:none;
  }

  .mast-logo{
    max-width:96vw;

    max-height:82px;
  }


  /* NAV */

  .main-nav{
    width:100%;
  }

  .main-nav a{
    min-width:0;

    max-width:none;

    padding:
      11px 2px;

    font-size:9px;
  }


  /* MAIN */

  .section{
    padding:
      8px 4px 20px;
  }


  /* TOP BANNER */

  .top-banner-wrap{
    width:100%;

    margin:
      7px auto 6px;

    padding:
      0 3px;
  }

  .top-banner{
    width:100%;

    border-radius:6px;
  }

  .top-banner img{
    width:100%;

    height:auto;

    display:block;
  }


  /* NEWSPAPER */

  .epaper-shell{
    padding:5px;

    border-radius:6px;
  }


  /* BOTTOM ADVERTISEMENT */

  #pageAdContainer{
    margin-top:8px;

    width:100%;

    overflow:hidden;
  }

  #bottomAdRotator{
    width:100%;

    border-radius:8px;
  }

  .bottom-ad-slide{
    width:100%;

    overflow:hidden;
  }

  .bottom-ad-slide img{
    display:block;

    width:100%;

    height:auto;

    max-width:100%;
  }


  /* CONTROLS */

  .epaper-tools{
    gap:5px;

    padding:
      8px 5px;
  }

  .epaper-tools button{
    padding:
      9px 10px;

    font-size:9px;
  }

  #counter{
    width:100%;

    order:-1;

    font-size:13px;
  }


  /* THUMBNAILS */

  .page-grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:7px;
  }

  .page-card b{
    font-size:9px;
  }

  .page-card span{
    font-size:7px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .epaper-tools button{
    padding:
      8px 8px;

    font-size:8px;
  }

}

</style>

</head>

  ================================================= -->

    <div id="bottomAdRotator">


      <!-- =================================================

<script>

/* =====================================================
   E-PAPER PAGE DATA
===================================================== */

const pages = [

  [
    "page-01.png",
    "01",
    "Front Page"
  ],

  [
    "page-02.png",
    "02",
    "Telangana"
  ],

  [
    "page-03.png",
    "03",
    "Regional"
  ],

  [
    "page-04.png",
    "04",
    "Business"
  ],

  [
    "page-05.png",
    "05",
    "World"
  ],

  [
    "page-06.png",
    "06",
    "Technology"
  ],

  [
    "page-07.png",
    "07",
    "Entertainment"
  ],

  [
    "page-08.png",
    "08",
    "Sports"
  ],

  [
    "page-09.png",
    "09",
    "Lifestyle"
  ],

  [
    "page-10.png",
    "10",
    "City Life"
  ]

];


let current = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const image =
  document.getElementById("pageImage");

const counter =
  document.getElementById("counter");

const grid =
  document.getElementById("pageGrid");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const fullScreenButton =
  document.getElementById("fullScreenButton");

const bottomAds =
  Array.from(
    document.querySelectorAll(
      "#bottomAdRotator .bottom-ad-slide"
    )
  );


/* =====================================================
   TIMERS
===================================================== */

let epaperRotationTimer = null;

let bottomAdRotationTimer = null;

let bottomAdIndex = 0;


/* =====================================================
   BUILD PAGE THUMBNAILS
===================================================== */

function buildPageGrid(){

  pages.forEach(
    function(page,index){

      const card =
        document.createElement("div");

      card.className =
        "page-card";

      card.tabIndex = 0;

      card.innerHTML = `

        <img
          src="${page[0]}"
          loading="lazy"
          alt="The Hyderabad Daily Page ${page[1]}"
        >

        <b>
          PAGE ${page[1]}
        </b>

        <span>
          ${page[2]}
        </span>

      `;


      card.addEventListener(
        "click",
        function(){

          showPage(
            index,
            true
          );

        }
      );


      card.addEventListener(
        "keydown",
        function(event){

          if(
            event.key === "Enter" ||
            event.key === " "
          ){

            event.preventDefault();

            showPage(
              index,
              true
            );

          }

        }
      );


      grid.appendChild(card);

    }
  );

}


/* =====================================================
   UPDATE ACTIVE THUMBNAIL
===================================================== */

function updateActiveCard(){

  document
    .querySelectorAll(".page-card")
    .forEach(
      function(card,index){

        card.classList.toggle(
          "active",
          index === current
        );

      }
    );

}


/* =====================================================
   SHOW PAGE

   IMPORTANT:
   NO WINDOW.SCROLLTO HERE.

   Automatic rotation therefore does NOT
   move the user's browser position.
===================================================== */

function showPage(
  index,
  manualAction = false
){

  current =
    Math.max(
      0,
      Math.min(
        index,
        pages.length - 1
      )
    );


  image.src =
    pages[current][0];


  image.alt =
    "The Hyderabad Daily E-Paper Page " +
    pages[current][1];


  counter.textContent =
    "PAGE " +
    pages[current][1] +
    " OF " +
    pages.length;


  updateActiveCard();

}


/* =====================================================
   NEXT PAGE

   PAGE 10 → PAGE 1
===================================================== */

function nextPage(){

  if(
    current <
    pages.length - 1
  ){

    showPage(
      current + 1
    );

  }
  else{

    showPage(0);

  }

}


/* =====================================================
   PREVIOUS PAGE

   PAGE 1 → PAGE 10
===================================================== */

function previousPage(){

  if(current > 0){

    showPage(
      current - 1
    );

  }
  else{

    showPage(
      pages.length - 1
    );

  }

}


/* =====================================================
   E-PAPER AUTO ROTATION

   EXACTLY 5 SECONDS
===================================================== */

function startEpaperRotation(){

  stopEpaperRotation();


  epaperRotationTimer =
    setTimeout(
      function rotateEpaper(){

        nextPage();

        epaperRotationTimer =
          setTimeout(
            rotateEpaper,
            5000
          );

      },
      5000
    );

}


/* =====================================================
   STOP E-PAPER ROTATION
===================================================== */

function stopEpaperRotation(){

  if(
    epaperRotationTimer !== null
  ){

    clearTimeout(
      epaperRotationTimer
    );

    epaperRotationTimer = null;

  }

}


/* =====================================================
   SHOW BOTTOM AD
===================================================== */

function showBottomAd(index){

  if(
    bottomAds.length === 0
  ){

    return;

  }


  bottomAds.forEach(
    function(ad){

      ad.classList.remove(
        "active"
      );

      ad.style.display =
        "none";

    }
  );


  bottomAdIndex =
    (
      index +
      bottomAds.length
    )
    %
    bottomAds.length;


  const selectedAd =
    bottomAds[
      bottomAdIndex
    ];


  selectedAd.style.display =
    "block";


  requestAnimationFrame(
    function(){

      selectedAd.classList.add(
        "active"
      );

    }
  );

}


/* =====================================================
   BOTTOM AD IMAGE ERROR HANDLING

   If an advertisement image ever disappears,
   automatically move to the next working ad.

   This prevents a blank advertising period.
===================================================== */

bottomAds.forEach(
  function(ad,index){

    const adImage =
      ad.querySelector("img");


    if(adImage){

      adImage.addEventListener(
        "error",
        function(){

          ad.style.display =
            "none";

          ad.classList.remove(
            "active"
          );


          if(
            bottomAds.length > 1
          ){

            showBottomAd(
              index + 1
            );

          }

        }
      );

    }

  }
);


/* =====================================================
   START BOTTOM AD ROTATION

   EXACTLY 3 SECONDS

   COMPLETELY INDEPENDENT
   FROM E-PAPER ROTATION.
===================================================== */

function startBottomAdRotation(){

  stopBottomAdRotation();


  if(
    bottomAds.length === 0
  ){

    return;

  }


  bottomAdIndex = 0;

  showBottomAd(0);


  bottomAdRotationTimer =
    setTimeout(
      function rotateAds(){

        if(
          bottomAds.length > 0
        ){

          bottomAdIndex =
            (
              bottomAdIndex + 1
            )
            %
            bottomAds.length;


          showBottomAd(
            bottomAdIndex
          );

        }


        bottomAdRotationTimer =
          setTimeout(
            rotateAds,
            3000
          );

      },
      3000
    );

}


/* =====================================================
   STOP BOTTOM AD ROTATION
===================================================== */

function stopBottomAdRotation(){

  if(
    bottomAdRotationTimer !== null
  ){

    clearTimeout(
      bottomAdRotationTimer
    );

    bottomAdRotationTimer = null;

  }

}


/* =====================================================
   FULL SCREEN
===================================================== */

function fullScreen(){

  const el =
    document.getElementById(
      "pageImage"
    );


  if(
    el.requestFullscreen
  ){

    el.requestFullscreen();

  }

  else if(
    el.webkitRequestFullscreen
  ){

    el.webkitRequestFullscreen();

  }

  else{

    window.open(
      el.src,
      "_blank"
    );

  }

}


/* =====================================================
   SWIPE SUPPORT
===================================================== */

let startX = 0;


image.addEventListener(
  "touchstart",
  function(event){

    startX =
      event.touches[0].clientX;

  },
  {
    passive:true
  }
);


image.addEventListener(
  "touchend",
  function(event){

    const endX =
      event.changedTouches[0].clientX;


    const distance =
      startX - endX;


    if(
      Math.abs(distance) > 70
    ){

      if(distance > 0){

        nextPage();

      }
      else{

        previousPage();

      }

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   BUTTON EVENTS
===================================================== */

previousButton.addEventListener(
  "click",
  function(){

    previousPage();

  }
);


nextButton.addEventListener(
  "click",
  function(){

    nextPage();

  }
);


fullScreenButton.addEventListener(
  "click",
  function(){

    fullScreen();

  }
);


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "ArrowRight"
    ){

      nextPage();

    }


    if(
      event.key === "ArrowLeft"
    ){

      previousPage();

    }

  }
);


/* =====================================================
   INITIALISE
===================================================== */

buildPageGrid();

showPage(0);

startEpaperRotation();

<script>

/* =====================================================
   AUTOMATIC DATE
===================================================== */

function updateHomeDate(){

  const now =
    new Date();


  const day =
    now.toLocaleDateString(
      "en-IN",
      {
        weekday:"long"
      }
    );


  const date =
    now.toLocaleDateString(
      "en-IN",
      {
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );


  const dayElement =
    document.getElementById(
      "homeDay"
    );


  const dateElement =
    document.getElementById(
      "homeDate"
    );


  if(dayElement){

    dayElement.textContent =
      day.toUpperCase();

  }


  if(dateElement){

    dateElement.textContent =
      date.toUpperCase();

  }

}


updateHomeDate();


setInterval(
  updateHomeDate,
  60000
);

</script>
